name: Metrics

on:
  # Atualiza uma vez por dia (00:17 no horário de Brasília)
  schedule:
    - cron: "17 3 * * *"
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Linguagens mais usadas (inclui repositórios privados via METRICS_TOKEN)
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_ignored: html, css, jupyter notebook
          plugin_languages_colors: github
          repositories_affiliations: owner, collaborator

      # Visão geral: cabeçalho, atividade e calendário de contribuições
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.overview.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity, community, repositories
          config_timezone: America/Sao_Paulo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
